{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "byok-relay.secretName" . }}
  labels:
    {{- include "byok-relay.labels" . | nindent 4 }}
type: Opaque
stringData:
  ENCRYPTION_SECRET: {{ required "secrets.encryptionSecret is required unless secrets.existingSecret is set" .Values.secrets.encryptionSecret | quote }}
  {{- with .Values.secrets.tokenHmacSecret }}
  TOKEN_HMAC_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.encryptionSalt }}
  ENCRYPTION_SALT: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.appSecret }}
  APP_SECRET: {{ . | quote }}
  {{- end }}
{{- end }}
