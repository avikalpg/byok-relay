apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "byok-relay.fullname" . }}-config
  labels:
    {{- include "byok-relay.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  ALLOWED_ORIGINS: {{ .Values.config.allowedOrigins | quote }}
  DB_PATH: {{ .Values.config.dbPath | quote }}
