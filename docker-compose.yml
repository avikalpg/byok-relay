services:
  relay:
    build: .
    image: byok-relay:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # SQLite database persists in a named Docker volume across restarts and
      # image rebuilds. Docker manages ownership so the container user (UID 1001)
      # can always write to it — no host chown step needed.
      # Safe backup (WAL-aware): docker run --rm -v relay_data:/data -v $(pwd):/out alpine sh -c 'apk add --no-cache sqlite && sqlite3 /data/relay.db ".backup /out/relay-backup-$(date +%s).db"'
      - relay_data:/app/data
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      ENCRYPTION_SECRET: "${ENCRYPTION_SECRET:?ENCRYPTION_SECRET is required — run: openssl rand -hex 32}"

      # ── Recommended ─────────────────────────────────────────────────────────
      # Separate HMAC key for hashing relay tokens at rest.
      # Generate with: openssl rand -hex 32
      TOKEN_HMAC_SECRET: ${TOKEN_HMAC_SECRET:-}

      # Salt for the API key encryption KDF.
      # Generate with: openssl rand -hex 32
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:-}

      # Gate POST /users with a shared secret (strongly recommended in production).
      # Generate with: openssl rand -hex 32
      APP_SECRET: ${APP_SECRET:-}

      # ── Networking ──────────────────────────────────────────────────────────
      # Comma-separated list of allowed CORS origins.
      # Example: https://myapp.example.com,http://localhost:3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # ── Database path ────────────────────────────────────────────────────────
      # Points inside the mounted volume — do not change unless you also
      # change the volume mapping above.
      DB_PATH: /app/data/relay.db

      PORT: "3000"
    healthcheck:
      test: ["CMD", "node", "-e",
             "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  relay_data:
    # Named volume managed by Docker — no host chown needed.
    # To bind-mount ./data instead, replace with:
    #   driver: local
    #   driver_opts: { type: none, o: bind, device: ./data }
    # and pre-create the directory: mkdir -p ./data && sudo chown 1001:1001 ./data
