name: CI

on:
  push:
    branches: ['**']     # run on every branch push
  pull_request:
    branches: [main]

jobs:
  test:
    name: E2E tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e  # v4.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run E2E test suite
        run: npm test
        env:
          # ENCRYPTION_SECRET is set inside the test process via spawn env;
          # this value is just a safety default so the process won't fail if
          # the env propagates to the parent before spawn isolates it.
          ENCRYPTION_SECRET: ci-placeholder-not-used-by-tests
