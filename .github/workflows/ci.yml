name: CI

on:
  push:
    branches: ['**']     # run on every branch push
  pull_request:
    branches: [main]

jobs:
  test:
    name: E2E tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run E2E test suite
        run: npm test
        env:
          # ENCRYPTION_SECRET is set inside the test process via spawn env;
          # this value is just a safety default so the process won't fail if
          # the env propagates to the parent before spawn isolates it.
          ENCRYPTION_SECRET: ci-placeholder-not-used-by-tests
